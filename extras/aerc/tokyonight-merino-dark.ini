# vim: ft=dosini
#
# aerc TokyoNight Merino styleset
# set styleset-name=tokyonight-merino-dark.ini in 'aerc.conf' to load the style
#

*.default=true
*.normal=true

border.fg=#2e3135
border.bg=#0d1117

title.fg=#0d1117
title.bg=#58a6ff
title.bold=true

header.fg=#ff7b72
#header.bg=#0d1117
header.bold=true

tab.fg=#666a6f
tab.bg=#131519
tab.selected.fg=#0d1117
tab.selected.bg=#58a6ff

statusline_default.fg=#e6edf3
statusline_default.bg=#131519
statusline_error.fg=#ff7b72
statusline_success.fg=#80b7ad

*error.bold=true
*error.fg=#ff7b72
*warning.fg=#d29922
*success.fg=#80b7ad

dirlist_*.bg=#0d1117
dirlist_*.fg=#e6edf3
dirlist_*.selected.bg=#383d43
dirlist_*.selected.fg=#e6edf3

msglist_*.bg=#0d1117
msglist_*.fg=#e6edf3
msglist_*.selected.bg=#383d43
#msglist_*.selected.fg=#e6edf3
msglist_unread.bold=true
msglist_unread.fg=#58a6ff
msglist_marked.fg=#e98a4a
msglist_thread_folded.italic=true
msglist_thread_folded.underline=true
msglist_gutter.bg=#23272d
msglist_pill.bg=#2e3135
msglist_pill.reverse=false

part_*.fg=#e6edf3
part_*.bg=#1e2023
part_*.selected.fg=#e6edf3
part_*.selected.bg=#2e3135

completion_default.bg=#1e2023
completion_default.fg=#e6edf3
completion_default.selected.bg=#2e3135
completion_default.selected.fg=#e6edf3
completion_gutter.bg=#23272d
completion_pill.bg=#2e3135
completion_pill.reverse=false

spinner.bg=#0d1117
spinner.fg=#e6edf3

selector_focused.bold=false
selector_focused.bg=#383d43
selector_focused.fg=#e6edf3
selector_chooser.bold=false
selector_chooser.bg=#383d43
selector_chooser.fg=#e6edf3
default.selected.bold=false
default.selected.fg=#e6edf3
default.selected.bg=#383d43

[viewer]
url.underline=true
url.fg=#82878c
header.fg=#bc8cff
signature.fg=#d2a8ff
diff_add.fg=#3fb950
diff_del.fg=#ff7b72
diff_meta.bold=true
diff_chunk.dim=true
quote_1.fg=#d29922
quote_2.fg=#a3bd8d
quote_3.fg=#39c5cf
quote_3.dim=true
quote_4.fg=#58a6ff
quote_4.dim=true
quote_x.fg=#82878c
quote_x.dim=true
