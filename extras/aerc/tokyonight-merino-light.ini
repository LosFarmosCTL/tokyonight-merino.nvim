# vim: ft=dosini
#
# aerc TokyoNight Merino styleset
# set styleset-name=tokyonight-merino-light.ini in 'aerc.conf' to load the style
#

*.default=true
*.normal=true

border.fg=#e7e9eb
border.bg=#ffffff

title.fg=#ffffff
title.bg=#0969da
title.bold=true

header.fg=#cf222e
#header.bg=#ffffff
header.bold=true

tab.fg=#878a8e
tab.bg=#eceef2
tab.selected.fg=#ffffff
tab.selected.bg=#0969da

statusline_default.fg=#1f2328
statusline_default.bg=#eceef2
statusline_error.fg=#cf222e
statusline_success.fg=#39786c

*error.bold=true
*error.fg=#cf222e
*warning.fg=#9d5c00
*success.fg=#39786c

dirlist_*.bg=#ffffff
dirlist_*.fg=#1f2328
dirlist_*.selected.bg=#cecfd0
dirlist_*.selected.fg=#1f2328

msglist_*.bg=#ffffff
msglist_*.fg=#1f2328
msglist_*.selected.bg=#cecfd0
#msglist_*.selected.fg=#1f2328
msglist_unread.bold=true
msglist_unread.fg=#0969da
msglist_marked.fg=#b63f17
msglist_thread_folded.italic=true
msglist_thread_folded.underline=true
msglist_gutter.bg=#e9e9ea
msglist_pill.bg=#e7e9eb
msglist_pill.reverse=false

part_*.fg=#1f2328
part_*.bg=#fafbfc
part_*.selected.fg=#1f2328
part_*.selected.bg=#e7e9eb

completion_default.bg=#fafbfc
completion_default.fg=#1f2328
completion_default.selected.bg=#e7e9eb
completion_default.selected.fg=#1f2328
completion_gutter.bg=#e9e9ea
completion_pill.bg=#e7e9eb
completion_pill.reverse=false

spinner.bg=#ffffff
spinner.fg=#1f2328

selector_focused.bold=false
selector_focused.bg=#cecfd0
selector_focused.fg=#1f2328
selector_chooser.bold=false
selector_chooser.bg=#cecfd0
selector_chooser.fg=#1f2328
default.selected.bold=false
default.selected.fg=#1f2328
default.selected.bg=#cecfd0

[viewer]
url.underline=true
url.fg=#696d71
header.fg=#8250df
signature.fg=#8250df
diff_add.fg=#116329
diff_del.fg=#cf222e
diff_meta.bold=true
diff_chunk.dim=true
quote_1.fg=#9d5c00
quote_2.fg=#116329
quote_3.fg=#1b7c83
quote_3.dim=true
quote_4.fg=#0969da
quote_4.dim=true
quote_x.fg=#696d71
quote_x.dim=true
